<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Chocolate</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
body {
  margin:0;
  overflow-x:hidden;
  font-family:'Orbitron', sans-serif;
  background:black;
  color:white;
}

canvas {
  position:fixed;
  top:0;
  left:0;
  z-index:-2;
}

.overlay {
  position:fixed;
  width:100%;
  height:100%;
  backdrop-filter: blur(10px);
  background: radial-gradient(circle at center, rgba(0,0,0,0.2), rgba(0,0,0,0.9));
  z-index:-1;
  transition: opacity 1s ease;
}

.section {
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

h1 {
  font-size:4rem;
  background: linear-gradient(90deg,#ff00cc,#3333ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.choco-container {
  position:relative;
  height:400px;
  width:100%;
}

.choco {
  position:absolute;
  width:150px;
  transition: transform 0.3s ease, filter 0.3s ease;
  cursor:pointer;
}

.choco:hover {
  transform: scale(1.2) rotate(10deg);
  filter: drop-shadow(0 0 20px #ff00cc);
}

.glass {
  padding:20px 40px;
  background:rgba(255,255,255,0.1);
  border-radius:20px;
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.2);
  margin-top:20px;
  transition:0.5s;
}

.glass:hover {
  box-shadow:0 0 40px #ff00cc;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>
<div class="overlay" id="overlay"></div>

<div class="section">
  <h1>ORBital Chocolate</h1>
  <div class="glass">A galaxis legcoolabb csokija</div>

  <div class="choco-container">
    <img src="https://i.imgur.com/3ZQ3Z4C.png" class="choco" id="left" style="left:20%;">
    <img src="https://i.imgur.com/3ZQ3Z4C.png" class="choco" id="center" style="left:45%;">
    <img src="https://i.imgur.com/3ZQ3Z4C.png" class="choco" id="right" style="left:70%;">
  </div>
</div>

<div class="section">
  <h1>Warp Into Flavor</h1>
</div>

<script>
// THREE.JS STARFIELD
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('bg')});
renderer.setSize(window.innerWidth, window.innerHeight);
camera.position.z = 5;

const starsGeometry = new THREE.BufferGeometry();
const starCount = 6000;
const positions = [];

for(let i=0;i<starCount;i++){
  positions.push((Math.random()-0.5)*2000);
  positions.push((Math.random()-0.5)*2000);
  positions.push((Math.random()-0.5)*2000);
}

starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
const starsMaterial = new THREE.PointsMaterial({color:0xffffff});
const starField = new THREE.Points(starsGeometry,starsMaterial);
scene.add(starField);

function animate(){
  requestAnimationFrame(animate);
  starField.rotation.y += 0.0005;
  renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// PARALLAX
document.addEventListener('mousemove',(e)=>{
  let x = (e.clientX/window.innerWidth-0.5)*2;
  let y = (e.clientY/window.innerHeight-0.5)*2;
  gsap.to(".choco",{x:x*50,y:y*50,duration:0.5});
});

// FLOATING CHOCOS
gsap.to("#left",{y:-30,repeat:-1,yoyo:true,duration:2});
gsap.to("#center",{y:-40,repeat:-1,yoyo:true,duration:2.5});
gsap.to("#right",{y:-35,repeat:-1,yoyo:true,duration:3});

// DISCORD LINK
document.getElementById("center").addEventListener("click",()=>{
  gsap.to("#center",{scale:5,opacity:0,duration:0.8});
  setTimeout(()=>{
    window.location.href="https://discord.gg/zmPAwS2QKH";
  },800);
});

// SCROLL FADE BACKGROUND
window.addEventListener("scroll",()=>{
  let scrollY = window.scrollY;
  let overlay = document.getElementById("overlay");
  overlay.style.opacity = 1 - scrollY/600;
});
</script>

</body>
</html>
