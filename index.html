<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orbital Chocolate</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Orbitron',sans-serif;
  background:black;
  overflow-x:hidden;
  color:white;
}

canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-3;
}

#overlay{
  position:fixed;
  width:100%;
  height:100%;
  background:radial-gradient(circle at center,rgba(0,0,0,0.1),rgba(0,0,0,0.95));
  backdrop-filter:blur(10px);
  z-index:-2;
  transition:opacity 1s;
}

.section{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
}

h1{
  font-size:4rem;
  font-weight:900;
  background:linear-gradient(90deg,#ff00cc,#00ffff,#ffcc00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: glow 3s infinite alternate;
}

@keyframes glow{
  from{filter:drop-shadow(0 0 10px #ff00cc);}
  to{filter:drop-shadow(0 0 30px #00ffff);}
}

.glass{
  margin-top:30px;
  padding:20px 40px;
  border-radius:25px;
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,0.2);
  transition:0.5s;
}

.glass:hover{
  box-shadow:0 0 50px #ff00cc;
  transform:scale(1.05);
}

.choco-container{
  position:relative;
  width:100%;
  height:400px;
  margin-top:50px;
}

.choco{
  position:absolute;
  width:160px;
  cursor:pointer;
  transition:0.4s;
}

.choco:hover{
  transform:scale(1.3) rotate(10deg);
  filter:drop-shadow(0 0 30px #ff00cc);
}

#chocoRain{
  position:fixed;
  pointer-events:none;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="chocoRain"></canvas>
<div id="overlay"></div>

<div class="section">
  <h1>ORBital Chocolate</h1>
  <div class="glass">Interstellar Flavor Experience</div>

  <div class="choco-container">
    <img src="https://i.imgur.com/3ZQ3Z4C.png" class="choco" id="left" style="left:15%;top:120px;">
    <img src="https://i.imgur.com/3ZQ3Z4C.png" class="choco" id="center" style="left:42%;top:80px;">
    <img src="https://i.imgur.com/3ZQ3Z4C.png" class="choco" id="right" style="left:70%;top:140px;">
  </div>
</div>

<div class="section">
  <h1>Warp Into Sweetness</h1>
</div>

<script>
// THREE STARFIELD + WARP
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,2000);
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById("bg")});
renderer.setSize(window.innerWidth,window.innerHeight);
camera.position.z=5;

const starGeo = new THREE.BufferGeometry();
const starCount=8000;
let positions=[];
for(let i=0;i<starCount;i++){
  positions.push((Math.random()-0.5)*2000);
  positions.push((Math.random()-0.5)*2000);
  positions.push((Math.random()-0.5)*2000);
}
starGeo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));
const starMat=new THREE.PointsMaterial({color:0xffffff,size:1});
const stars=new THREE.Points(starGeo,starMat);
scene.add(stars);

function animate(){
  requestAnimationFrame(animate);
  stars.rotation.y+=0.0007;
  stars.position.z+=0.5;
  if(stars.position.z>1000) stars.position.z=0;
  renderer.render(scene,camera);
}
animate();

// RESIZE
window.addEventListener("resize",()=>{
  renderer.setSize(window.innerWidth,window.innerHeight);
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});

// PARALLAX
document.addEventListener("mousemove",(e)=>{
  let x=(e.clientX/window.innerWidth-0.5)*2;
  let y=(e.clientY/window.innerHeight-0.5)*2;
  gsap.to(".choco",{x:x*60,y:y*60,duration:0.5});
});

// FLOATING
gsap.to("#left",{y:-30,repeat:-1,yoyo:true,duration:2});
gsap.to("#center",{y:-50,repeat:-1,yoyo:true,duration:2.5});
gsap.to("#right",{y:-40,repeat:-1,yoyo:true,duration:3});

// DISCORD WARP
document.getElementById("center").addEventListener("click",()=>{
  gsap.to("#center",{scale:8,opacity:0,rotation:720,duration:1});
  gsap.to("body",{background:"#fff",duration:1});
  setTimeout(()=>{
    window.location.href="https://discord.gg/zmPAwS2QKH";
  },1000);
});

// SCROLL FADE + SPEED BOOST
window.addEventListener("scroll",()=>{
  let s=window.scrollY;
  document.getElementById("overlay").style.opacity=1-s/600;
  stars.rotation.y+=s*0.00002;
});

// CHOCOLATE RAIN
const rainCanvas=document.getElementById("chocoRain");
const ctx=rainCanvas.getContext("2d");
rainCanvas.width=window.innerWidth;
rainCanvas.height=window.innerHeight;

let drops=[];
for(let i=0;i<50;i++){
  drops.push({
    x:Math.random()*rainCanvas.width,
    y:Math.random()*rainCanvas.height,
    speed:2+Math.random()*3,
    size:20+Math.random()*20
  });
}

function rain(){
  ctx.clearRect(0,0,rainCanvas.width,rainCanvas.height);
  ctx.fillStyle="rgba(255,0,200,0.8)";
  drops.forEach(d=>{
    ctx.beginPath();
    ctx.arc(d.x,d.y,d.size/4,0,Math.PI*2);
    ctx.fill();
    d.y+=d.speed;
    if(d.y>rainCanvas.height) d.y=0;
  });
  requestAnimationFrame(rain);
}
rain();
</script>

</body>
</html>
